<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أذكار — Azkar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Amiri:wght@400;700&family=Noto+Sans+Malayalam:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function(){
    var t = null;
    try { t = localStorage.getItem('azkar-theme'); } catch(e){}
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root{
    --bg-1:#efe9f8;
    --bg-2:#e3ddf3;
    --clay:#f2eefb;
    --ink:#413a5c;
    --ink-soft:#7c7396;
    --sun-1:#ffd58a;
    --sun-2:#ff9f5b;
    --moon-1:#a99cf5;
    --moon-2:#6f5fd6;
    --good:#63c99b;
    --shadow-d: rgba(148,132,199,0.55);
    --shadow-l: rgba(255,255,255,0.9);
    --track: rgba(148,132,199,.25);
    --morning-ink:#c9752b;
    --evening-ink:#5b4bc4;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg-1:#1f1b2e;
    --bg-2:#2a2540;
    --clay:#29243d;
    --ink:#ece8fa;
    --ink-soft:#a59ec2;
    --shadow-d: rgba(6,4,14,0.75);
    --shadow-l: rgba(92,82,138,0.32);
    --track: rgba(255,255,255,.08);
    --morning-ink:#ffb36e;
    --evening-ink:#b8acff;
    color-scheme: dark;
  }
  body, .phone, .zikr-card, .back-btn, .counter-btn, .progress-wrap, .theme-btn{ transition: background-color .3s ease, color .3s ease, box-shadow .3s ease; }

  .theme-btn{
    position:absolute; top:22px; left:18px; z-index:5;
    width:42px; height:42px; border-radius:16px; border:none;
    background: var(--clay); color: var(--ink-soft);
    box-shadow: 6px 6px 12px var(--shadow-d), -5px -5px 12px var(--shadow-l);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .theme-btn:active{ box-shadow: inset 4px 4px 8px var(--shadow-d), inset -4px -4px 8px var(--shadow-l); }
  .theme-btn:focus-visible, .back-btn:focus-visible, .counter-btn:focus-visible, .clay-btn:focus-visible{ outline:2px solid var(--evening-ink); outline-offset:3px; }
  .theme-btn svg{ width:20px; height:20px; }
  .theme-btn .icon-sun{ display:none; }
  :root[data-theme="dark"] .theme-btn .icon-sun{ display:block; }
  :root[data-theme="dark"] .theme-btn .icon-moon{ display:none; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Baloo 2', sans-serif;
    background: radial-gradient(circle at 30% 0%, var(--bg-2), var(--bg-1) 60%);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:24px 12px;
    color:var(--ink);
  }
  .phone{
    width:100%;
    max-width:400px;
    min-height:760px;
    background: var(--bg-1);
    border-radius:44px;
    padding:22px 18px 30px;
    position:relative;
    box-shadow:
      14px 14px 30px var(--shadow-d),
      -12px -12px 28px var(--shadow-l);
    overflow:hidden;
  }
  .screen{ display:none; flex-direction:column; height:100%; animation: fade .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- HOME ---------- */
  .home-header{ text-align:center; margin-top:6px; margin-bottom:8px;}
  .home-header h1{ font-size:30px; margin:0; font-weight:800; letter-spacing:.5px;}
  .home-header p{ margin:6px 0 0; font-size:13px; color:var(--ink-soft); font-family:'Baloo 2'; direction:ltr; }

  .clay-buttons{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:34px;
    padding-bottom:20px;
  }
  .clay-btn{
    width:190px;
    height:190px;
    border-radius:50%;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    color:#fff;
    font-family:'Baloo 2';
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .clay-btn:active{ transform: scale(.94); }
  .clay-btn .big{ font-size:19px; font-weight:700; }
  .clay-btn .small{ font-size:12px; opacity:.9; direction:ltr; font-weight:500;}
  .clay-btn svg{ width:46px; height:46px; margin-bottom:2px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.15)); }

  .sun{
    background: radial-gradient(circle at 32% 28%, var(--sun-1), var(--sun-2) 75%);
    box-shadow:
      10px 10px 22px rgba(214,120,40,0.45),
      -8px -8px 20px var(--shadow-l);
  }
  .moon{
    background: radial-gradient(circle at 32% 28%, var(--moon-1), var(--moon-2) 75%);
    box-shadow:
      10px 10px 22px rgba(83,63,168,0.45),
      -8px -8px 20px var(--shadow-l);
  }

  .home-footer{ text-align:center; font-size:11px; color:var(--ink-soft); padding-bottom:4px; }

  /* ---------- LIST SCREEN ---------- */
  .list-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back-btn{
    width:42px; height:42px; border-radius:16px; border:none;
    background: var(--clay);
    box-shadow: 6px 6px 12px var(--shadow-d), -5px -5px 12px var(--shadow-l);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex-shrink:0; color: var(--ink-soft);
  }
  .back-btn:active{ box-shadow: inset 4px 4px 8px var(--shadow-d), inset -4px -4px 8px var(--shadow-l); }
  .back-btn svg{ width:18px; height:18px; }
  .list-title{ font-size:19px; font-weight:700; margin:0; }
  .list-sub{ font-size:11px; color:var(--ink-soft); margin:1px 0 0; direction:ltr; }

  .progress-wrap{
    background:var(--clay);
    border-radius:20px;
    padding:12px 16px;
    margin-bottom:16px;
    box-shadow: inset 5px 5px 10px var(--shadow-d), inset -5px -5px 10px var(--shadow-l);
  }
  .progress-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .progress-track{ height:10px; border-radius:8px; background:var(--track); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:8px; transition:width .3s ease; }
  .progress-fill.morning{ background: linear-gradient(90deg, var(--sun-1), var(--sun-2)); }
  .progress-fill.evening{ background: linear-gradient(90deg, var(--moon-1), var(--moon-2)); }

  .azkar-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding-bottom:10px; -ms-overflow-style:none; scrollbar-width:none; }
  .azkar-list::-webkit-scrollbar{ display:none; }

  .zikr-card{
    background:var(--clay);
    border-radius:24px;
    padding:16px 16px 14px;
    box-shadow: 7px 7px 16px var(--shadow-d), -6px -6px 16px var(--shadow-l);
    display:flex; flex-direction:column; gap:10px;
    transition: box-shadow .25s ease, opacity .25s ease;
  }
  .zikr-card.done{ opacity:.55; }
  .zikr-text{
    font-family:'Amiri', serif;
    font-size:19px;
    line-height:2;
    text-align:right;
    color:var(--ink);
  }
  .ml-toggle{
    align-self:flex-start;
    display:inline-flex; align-items:center; gap:6px;
    border:none; cursor:pointer;
    font-family:'Noto Sans Malayalam', sans-serif; font-size:13px; font-weight:500;
    color:var(--ink-soft);
    background:var(--bg-1);
    padding:7px 14px; border-radius:14px;
    box-shadow: 4px 4px 9px var(--shadow-d), -3px -3px 8px var(--shadow-l);
    transition: box-shadow .15s ease, color .2s ease;
  }
  .ml-toggle:active{ box-shadow: inset 3px 3px 7px var(--shadow-d), inset -3px -3px 7px var(--shadow-l); }
  .ml-toggle:focus-visible{ outline:2px solid var(--evening-ink); outline-offset:3px; }
  .ml-toggle svg{ width:15px; height:15px; transition: transform .25s ease; }
  .zikr-card.ml-open .ml-toggle{ color:var(--ink); }
  .zikr-card.ml-open .ml-toggle svg{ transform: rotate(180deg); }
  .ml-text{
    display:none;
    direction:ltr; text-align:left;
    font-family:'Noto Sans Malayalam', sans-serif;
    font-size:15px; line-height:1.95;
    color:var(--ink);
    background:var(--bg-1);
    padding:12px 14px; border-radius:16px;
    box-shadow: inset 4px 4px 9px var(--shadow-d), inset -4px -4px 9px var(--shadow-l);
  }
  .zikr-card.ml-open .ml-text{ display:block; animation: fade .25s ease; }
  @media (prefers-reduced-motion: reduce){ .zikr-card.ml-open .ml-text{ animation:none; } .ml-toggle svg{ transition:none; } }
  .zikr-meta{ display:flex; align-items:center; justify-content:space-between; }
  .zikr-note{ font-size:12px; color:var(--ink-soft); direction:rtl; }

  .counter-btn{
    width:52px; height:52px; border-radius:50%; border:none; flex-shrink:0;
    font-family:'Baloo 2'; font-weight:700; font-size:17px;
    background: var(--clay); color:var(--ink);
    box-shadow: 6px 6px 12px var(--shadow-d), -5px -5px 12px var(--shadow-l);
    cursor:pointer; transition: transform .1s ease, box-shadow .15s ease, background .2s ease, color .2s ease;
  }
  .counter-btn:active{ transform:scale(.9); box-shadow: inset 4px 4px 9px var(--shadow-d), inset -4px -4px 9px var(--shadow-l); }
  .counter-btn.morning-c{ color:var(--morning-ink); }
  .counter-btn.evening-c{ color:var(--evening-ink); }
  .counter-btn.finished{ background: linear-gradient(145deg, var(--good), #4bb583); color:#fff; box-shadow: 5px 5px 10px rgba(70,160,120,.5), -4px -4px 10px var(--shadow-l); }

  .reset-row{ text-align:center; padding-top:8px; }
  .reset-btn{
    border:none; background:transparent; color:var(--ink-soft);
    font-family:'Baloo 2'; font-size:12px; text-decoration:underline;
    cursor:pointer; padding:6px;
  }
</style>
</head>
<body>

<div class="phone">

  <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Switch to dark theme">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>
  </button>

  <!-- HOME SCREEN -->
  <div class="screen active" id="home">
    <div class="home-header">
      <h1>أذكار</h1>
      <p>Morning &amp; Evening Adhkar</p>
    </div>
    <div class="clay-buttons">
      <button class="clay-btn sun" onclick="openList('morning')">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="#fff"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></g></svg>
        <span class="big">أذكار الصباح</span>
        <span class="small">Morning</span>
      </button>
      <button class="clay-btn moon" onclick="openList('evening')">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
        <span class="big">أذكار المساء</span>
        <span class="small">Evening</span>
      </button>
    </div>
    <div class="home-footer">اضغط على الذكر لعدّ التكرار</div>
  </div>

  <!-- MORNING LIST -->
  <div class="screen" id="morning">
    <div class="list-header">
      <button class="back-btn" onclick="goHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div>
        <p class="list-title">أذكار الصباح</p>
        <p class="list-sub">Morning Adhkar</p>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-row"><span id="morning-progress-label">0 / 0 مكتمل</span><span>🌅</span></div>
      <div class="progress-track"><div class="progress-fill morning" id="morning-progress-fill" style="width:0%"></div></div>
    </div>
    <div class="azkar-list" id="morning-list"></div>
    <div class="reset-row"><button class="reset-btn" onclick="resetList('morning')">إعادة ضبط العدّاد Reset</button></div>
  </div>

  <!-- EVENING LIST -->
  <div class="screen" id="evening">
    <div class="list-header">
      <button class="back-btn" onclick="goHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div>
        <p class="list-title">أذكار المساء</p>
        <p class="list-sub">Evening Adhkar</p>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-row"><span id="evening-progress-label">0 / 0 مكتمل</span><span>🌙</span></div>
      <div class="progress-track"><div class="progress-fill evening" id="evening-progress-fill" style="width:0%"></div></div>
    </div>
    <div class="azkar-list" id="evening-list"></div>
    <div class="reset-row"><button class="reset-btn" onclick="resetList('evening')">إعادة ضبط العدّاد Reset</button></div>
  </div>

</div>

<script>
// Each entry: m = morning text, e = evening text (omit e if same as morning; m:null = evening only)
const LIST = [
  { label:"آية الكرسي", target:1,
    m:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ، لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ، مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ، يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ، وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ، وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ، وَلَا يَئُودُهُ حِفْظُهُمَا، وَهُوَ الْعَلِيُّ الْعَظِيمُ." },
  { label:"خواتيم سورة البقرة", target:1, m:null,
    e:"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ، كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ، وَقَالُوا سَمِعْنَا وَأَطَعْنَا، غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ. لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا، لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ، رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا، رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا، رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ، وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا، أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ." },
  { label:"سورة الإخلاص", target:3,
    m:"قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ." },
  { label:"سورة الفلق", target:3,
    m:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ." },
  { label:"سورة الناس", target:3,
    m:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَٰهِ النَّاسِ، مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ." },
  { target:1,

const ML = [
  { ml:"അല്ലാഹു — അവനല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല. അവൻ എന്നെന്നും ജീവിച്ചിരിക്കുന്നവനും എല്ലാം നിയന്ത്രിക്കുന്നവനുമാണ്. മയക്കമോ ഉറക്കമോ അവനെ ബാധിക്കുകയില്ല. ആകാശങ്ങളിലും ഭൂമിയിലുമുള്ളതെല്ലാം അവന്റേതാണ്. അവന്റെ അനുവാദമില്ലാതെ അവന്റെ അടുക്കൽ ശുപാർശ ചെയ്യാൻ ആരുണ്ട്? അവരുടെ മുന്നിലുള്ളതും പിന്നിലുള്ളതും അവൻ അറിയുന്നു. അവൻ ഉദ്ദേശിച്ചതല്ലാതെ അവന്റെ അറിവിൽ നിന്ന് യാതൊന്നും അവർക്ക് അറിയാൻ കഴിയില്ല. അവന്റെ കുർസിയ്യ് ആകാശങ്ങളെയും ഭൂമിയെയും ഉൾക്കൊള്ളുന്നു. അവയുടെ സംരക്ഷണം അവന് ഒട്ടും ഭാരമല്ല. അവൻ അത്യുന്നതനും മഹാനുമാകുന്നു." },
  { ml:"റസൂൽ തന്റെ രക്ഷിതാവിങ്കൽ നിന്ന് തനിക്ക് അവതരിപ്പിക്കപ്പെട്ടതിൽ വിശ്വസിച്ചിരിക്കുന്നു; സത്യവിശ്വാസികളും. അവരെല്ലാവരും അല്ലാഹുവിലും അവന്റെ മലക്കുകളിലും ഗ്രന്ഥങ്ങളിലും ദൂതന്മാരിലും വിശ്വസിച്ചിരിക്കുന്നു. അവന്റെ ദൂതന്മാരിൽ ആർക്കുമിടയിൽ ഞങ്ങൾ വിവേചനം കാണിക്കുന്നില്ല. അവർ പറഞ്ഞു: ഞങ്ങൾ കേൾക്കുകയും അനുസരിക്കുകയും ചെയ്തിരിക്കുന്നു. ഞങ്ങളുടെ നാഥാ, നിന്നോട് ഞങ്ങൾ പാപമോചനം തേടുന്നു; നിന്നിലേക്കാണ് മടക്കം. അല്ലാഹു ഒരാളോടും അയാളുടെ കഴിവിൽ പെട്ടതല്ലാതെ നിർബന്ധിക്കുകയില്ല. ഓരോരുത്തരും നേടിയ നന്മ അവർക്കുള്ളതാണ്; ചെയ്ത തിന്മ അവർക്കെതിരുമാണ്. ഞങ്ങളുടെ നാഥാ, ഞങ്ങൾ മറന്നുപോവുകയോ തെറ്റുചെയ്യുകയോ ചെയ്താൽ ഞങ്ങളെ നീ ശിക്ഷിക്കരുതേ. ഞങ്ങളുടെ നാഥാ, ഞങ്ങളുടെ മുമ്പുള്ളവരുടെ മേൽ നീ ചുമത്തിയതുപോലെയുള്ള ഭാരം ഞങ്ങളുടെ മേൽ ചുമത്തരുതേ. ഞങ്ങളുടെ നാഥാ, ഞങ്ങൾക്ക് താങ്ങാൻ കഴിയാത്തത് ഞങ്ങളെക്കൊണ്ട് വഹിപ്പിക്കരുതേ. ഞങ്ങൾക്ക് നീ മാപ്പ് നൽകുകയും ഞങ്ങളോട് പൊറുക്കുകയും കരുണ കാണിക്കുകയും ചെയ്യേണമേ. നീയാണ് ഞങ്ങളുടെ രക്ഷാധികാരി. അതിനാൽ സത്യനിഷേധികളായ ജനതക്കെതിരിൽ ഞങ്ങളെ നീ സഹായിക്കേണമേ." },
  { ml:"പറയുക: അവൻ അല്ലാഹു, ഏകനാണ്. അല്ലാഹു എല്ലാവരും ആശ്രയിക്കുന്നവനും ആരെയും ആശ്രയിക്കാത്തവനുമാണ്. അവൻ ജനിപ്പിച്ചിട്ടില്ല; ജനിച്ചിട്ടുമില്ല. അവന് തുല്യനായി ആരുമില്ല." },
  { ml:"പറയുക: പ്രഭാതത്തിന്റെ രക്ഷിതാവിനോട് ഞാൻ ശരണം തേടുന്നു; അവൻ സൃഷ്ടിച്ചവയുടെ ഉപദ്രവത്തിൽ നിന്നും, ഇരുട്ട് വ്യാപിക്കുമ്പോൾ രാത്രിയുടെ ഉപദ്രവത്തിൽ നിന്നും, കെട്ടുകളിൽ ഊതുന്നവരുടെ ഉപദ്രവത്തിൽ നിന്നും, അസൂയാലു അസൂയപ്പെടുമ്പോൾ അവന്റെ ഉപദ്രവത്തിൽ നിന്നും." },
  { ml:"പറയുക: മനുഷ്യരുടെ രക്ഷിതാവിനോട് ഞാൻ ശരണം തേടുന്നു; മനുഷ്യരുടെ രാജാവിനോട്, മനുഷ്യരുടെ ആരാധ്യനോട്; ദുർമന്ത്രണം നടത്തി പിൻവാങ്ങുന്നവന്റെ ഉപദ്രവത്തിൽ നിന്ന്. അവൻ മനുഷ്യരുടെ ഹൃദയങ്ങളിൽ ദുർമന്ത്രണം നടത്തുന്നു; ജിന്നുകളിൽ നിന്നും മനുഷ്യരിൽ നിന്നുമുള്ളവൻ." },
  { ml:"ഞങ്ങൾ പ്രഭാതത്തിൽ പ്രവേശിച്ചിരിക്കുന്നു; ആധിപത്യം അല്ലാഹുവിന്റേതായിരിക്കെ. എല്ലാ സ്തുതിയും അല്ലാഹുവിനാണ്. അല്ലാഹുവല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല; അവൻ ഏകനാണ്, അവന് പങ്കുകാരില്ല. ആധിപത്യം അവന്റേതാണ്, സ്തുതിയും അവനാണ്. അവൻ എല്ലാ കാര്യത്തിനും കഴിവുള്ളവനാണ്. എന്റെ നാഥാ, ഈ ദിവസത്തിലുള്ള നന്മയും അതിനു ശേഷമുള്ള നന്മയും ഞാൻ നിന്നോട് ചോദിക്കുന്നു. ഈ ദിവസത്തിലുള്ള തിന്മയിൽ നിന്നും അതിനു ശേഷമുള്ള തിന്മയിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. എന്റെ നാഥാ, അലസതയിൽ നിന്നും വാർധക്യത്തിന്റെ ദുരിതത്തിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. എന്റെ നാഥാ, നരകത്തിലെ ശിക്ഷയിൽ നിന്നും ഖബറിലെ ശിക്ഷയിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു.",
    mle:"ഞങ്ങൾ സന്ധ്യയിൽ പ്രവേശിച്ചിരിക്കുന്നു; ആധിപത്യം അല്ലാഹുവിന്റേതായിരിക്കെ. എല്ലാ സ്തുതിയും അല്ലാഹുവിനാണ്. അല്ലാഹുവല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല; അവൻ ഏകനാണ്, അവന് പങ്കുകാരില്ല. ആധിപത്യം അവന്റേതാണ്, സ്തുതിയും അവനാണ്. അവൻ എല്ലാ കാര്യത്തിനും കഴിവുള്ളവനാണ്. എന്റെ നാഥാ, ഈ രാത്രിയിലുള്ള നന്മയും അതിനു ശേഷമുള്ള നന്മയും ഞാൻ നിന്നോട് ചോദിക്കുന്നു. ഈ രാത്രിയിലുള്ള തിന്മയിൽ നിന്നും അതിനു ശേഷമുള്ള തിന്മയിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. എന്റെ നാഥാ, അലസതയിൽ നിന്നും വാർധക്യത്തിന്റെ ദുരിതത്തിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. എന്റെ നാഥാ, നരകത്തിലെ ശിക്ഷയിൽ നിന്നും ഖബറിലെ ശിക്ഷയിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു." },
  { ml:"അല്ലാഹുവേ, നീയാണ് എന്റെ രക്ഷിതാവ്. നീയല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല. നീ എന്നെ സൃഷ്ടിച്ചു; ഞാൻ നിന്റെ അടിമയാണ്. എനിക്ക് കഴിയുന്നിടത്തോളം നിന്നോടുള്ള കരാറിലും വാഗ്ദാനത്തിലും ഞാൻ നിലകൊള്ളുന്നു. ഞാൻ ചെയ്ത തിന്മയിൽ നിന്ന് ഞാൻ നിന്നോട് ശരണം തേടുന്നു. നീ എനിക്ക് ചെയ്ത അനുഗ്രഹങ്ങൾ ഞാൻ സമ്മതിക്കുന്നു; എന്റെ പാപവും ഞാൻ സമ്മതിക്കുന്നു. അതിനാൽ എനിക്ക് നീ പൊറുത്തുതരേണമേ. തീർച്ചയായും നീയല്ലാതെ പാപങ്ങൾ പൊറുക്കുന്നവനില്ല." },
  { ml:"അല്ലാഹുവിനെ രക്ഷിതാവായും ഇസ്‌ലാമിനെ മതമായും മുഹമ്മദ് നബി (സ്വ) യെ പ്രവാചകനായും ഞാൻ തൃപ്തിപ്പെട്ടിരിക്കുന്നു." },
  { ml:"അല്ലാഹുവേ, ഞാൻ പ്രഭാതത്തിൽ പ്രവേശിച്ചിരിക്കുന്നു. നിന്നെയും നിന്റെ അർശ് വഹിക്കുന്നവരെയും നിന്റെ മലക്കുകളെയും നിന്റെ എല്ലാ സൃഷ്ടികളെയും ഞാൻ സാക്ഷി നിർത്തുന്നു: നീയാണ് അല്ലാഹു, നീയല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല, നീ ഏകനാണ്, നിനക്ക് പങ്കുകാരില്ല, മുഹമ്മദ് നിന്റെ അടിമയും ദൂതനുമാണ്.",
    mle:"അല്ലാഹുവേ, ഞാൻ സന്ധ്യയിൽ പ്രവേശിച്ചിരിക്കുന്നു. നിന്നെയും നിന്റെ അർശ് വഹിക്കുന്നവരെയും നിന്റെ മലക്കുകളെയും നിന്റെ എല്ലാ സൃഷ്ടികളെയും ഞാൻ സാക്ഷി നിർത്തുന്നു: നീയാണ് അല്ലാഹു, നീയല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല, നീ ഏകനാണ്, നിനക്ക് പങ്കുകാരില്ല, മുഹമ്മദ് നിന്റെ അടിമയും ദൂതനുമാണ്." },
  { ml:"അല്ലാഹുവേ, ഈ പ്രഭാതത്തിൽ എനിക്കോ നിന്റെ സൃഷ്ടികളിൽ ആർക്കെങ്കിലുമോ ലഭിച്ച ഏതൊരു അനുഗ്രഹവും നിന്നിൽ നിന്ന് മാത്രമാണ്; നിനക്ക് പങ്കുകാരില്ല. അതിനാൽ നിനക്കാണ് എല്ലാ സ്തുതിയും നന്ദിയും.",
    mle:"അല്ലാഹുവേ, ഈ സന്ധ്യയിൽ എനിക്കോ നിന്റെ സൃഷ്ടികളിൽ ആർക്കെങ്കിലുമോ ലഭിച്ച ഏതൊരു അനുഗ്രഹവും നിന്നിൽ നിന്ന് മാത്രമാണ്; നിനക്ക് പങ്കുകാരില്ല. അതിനാൽ നിനക്കാണ് എല്ലാ സ്തുതിയും നന്ദിയും." },
  { ml:"എനിക്ക് അല്ലാഹു മതി. അവനല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല. അവനിൽ ഞാൻ ഭരമേൽപ്പിച്ചിരിക്കുന്നു. അവൻ മഹത്തായ അർശിന്റെ രക്ഷിതാവാണ്." },
  { ml:"ആരുടെ നാമത്തോടൊപ്പം ഭൂമിയിലോ ആകാശത്തിലോ യാതൊന്നും ഉപദ്രവിക്കുകയില്ലയോ, ആ അല്ലാഹുവിന്റെ നാമത്തിൽ. അവൻ എല്ലാം കേൾക്കുന്നവനും അറിയുന്നവനുമാണ്." },
  { ml:"അല്ലാഹുവേ, നിന്നാലാണ് ഞങ്ങൾ പ്രഭാതത്തിൽ പ്രവേശിച്ചത്, നിന്നാലാണ് ഞങ്ങൾ സന്ധ്യയിൽ പ്രവേശിക്കുന്നത്. നിന്നാലാണ് ഞങ്ങൾ ജീവിക്കുന്നതും മരിക്കുന്നതും. നിന്നിലേക്കാണ് പുനരുത്ഥാനം.",
    mle:"അല്ലാഹുവേ, നിന്നാലാണ് ഞങ്ങൾ സന്ധ്യയിൽ പ്രവേശിച്ചത്, നിന്നാലാണ് ഞങ്ങൾ പ്രഭാതത്തിൽ പ്രവേശിക്കുന്നത്. നിന്നാലാണ് ഞങ്ങൾ ജീവിക്കുന്നതും മരിക്കുന്നതും. നിന്നിലേക്കാണ് അന്തിമ മടക്കം." },
  { ml:"ഇസ്‌ലാമിന്റെ ശുദ്ധപ്രകൃതിയിലും ഇഖ്‌ലാസിന്റെ വചനത്തിലും ഞങ്ങളുടെ നബി മുഹമ്മദ് (സ്വ) യുടെ മതത്തിലും, ഋജുമനസ്കനും മുസ്‌ലിമുമായിരുന്ന, ബഹുദൈവാരാധകരിൽ പെടാതിരുന്ന ഞങ്ങളുടെ പിതാവ് ഇബ്‌റാഹീമിന്റെ മാർഗത്തിലുമായി ഞങ്ങൾ പ്രഭാതത്തിൽ പ്രവേശിച്ചിരിക്കുന്നു.",
    mle:"ഇസ്‌ലാമിന്റെ ശുദ്ധപ്രകൃതിയിലും ഇഖ്‌ലാസിന്റെ വചനത്തിലും ഞങ്ങളുടെ നബി മുഹമ്മദ് (സ്വ) യുടെ മതത്തിലും, ഋജുമനസ്കനും മുസ്‌ലിമുമായിരുന്ന, ബഹുദൈവാരാധകരിൽ പെടാതിരുന്ന ഞങ്ങളുടെ പിതാവ് ഇബ്‌റാഹീമിന്റെ മാർഗത്തിലുമായി ഞങ്ങൾ സന്ധ്യയിൽ പ്രവേശിച്ചിരിക്കുന്നു." },
  { ml:"അല്ലാഹുവിന്റെ സൃഷ്ടികളുടെ എണ്ണത്തോളവും, അവന്റെ തൃപ്തിയോളവും, അവന്റെ അർശിന്റെ ഭാരത്തോളവും, അവന്റെ വചനങ്ങളുടെ മഷിയോളവും അവനെ സ്തുതിച്ചുകൊണ്ട് ഞാൻ പരിശുദ്ധപ്പെടുത്തുന്നു." },
  { ml:"അല്ലാഹുവേ, എന്റെ ശരീരത്തിന് സൗഖ്യം നൽകേണമേ. അല്ലാഹുവേ, എന്റെ കേൾവിക്ക് സൗഖ്യം നൽകേണമേ. അല്ലാഹുവേ, എന്റെ കാഴ്ചക്ക് സൗഖ്യം നൽകേണമേ. നീയല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല." },
  { ml:"അല്ലാഹുവേ, സത്യനിഷേധത്തിൽ നിന്നും ദാരിദ്ര്യത്തിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. ഖബറിലെ ശിക്ഷയിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. നീയല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല." },
  { ml:"അല്ലാഹുവേ, ഇഹലോകത്തും പരലോകത്തും ഞാൻ നിന്നോട് മാപ്പും സൗഖ്യവും ചോദിക്കുന്നു. അല്ലാഹുവേ, എന്റെ മതത്തിലും ഐഹികജീവിതത്തിലും കുടുംബത്തിലും സമ്പത്തിലും ഞാൻ നിന്നോട് മാപ്പും സൗഖ്യവും ചോദിക്കുന്നു. അല്ലാഹുവേ, എന്റെ ന്യൂനതകൾ നീ മറച്ചുവെക്കുകയും എന്റെ ഭയങ്ങളിൽ നിന്ന് എനിക്ക് നിർഭയത്വം നൽകുകയും ചെയ്യേണമേ. അല്ലാഹുവേ, എന്റെ മുന്നിൽ നിന്നും പിന്നിൽ നിന്നും വലതുഭാഗത്തു നിന്നും ഇടതുഭാഗത്തു നിന്നും മുകളിൽ നിന്നും നീ എന്നെ സംരക്ഷിക്കേണമേ. എന്റെ താഴെ നിന്ന് ഞാൻ പെട്ടെന്ന് പിടികൂടപ്പെടുന്നതിൽ നിന്ന് നിന്റെ മഹത്വം കൊണ്ട് ഞാൻ ശരണം തേടുന്നു." },
  { ml:"എന്നെന്നും ജീവിച്ചിരിക്കുന്നവനേ, എല്ലാം നിയന്ത്രിക്കുന്നവനേ, നിന്റെ കാരുണ്യം കൊണ്ട് ഞാൻ സഹായം തേടുന്നു. എന്റെ എല്ലാ കാര്യങ്ങളും നീ നന്നാക്കിത്തരേണമേ. ഒരു കണ്ണിമവെട്ടുന്ന നേരത്തേക്കു പോലും എന്നെ എന്നിലേക്ക് ഏൽപ്പിക്കരുതേ." },
  { ml:"ഞങ്ങൾ പ്രഭാതത്തിൽ പ്രവേശിച്ചിരിക്കുന്നു; ആധിപത്യം ലോകരക്ഷിതാവായ അല്ലാഹുവിന്റേതായിരിക്കെ. അല്ലാഹുവേ, ഈ ദിവസത്തിന്റെ നന്മ — അതിന്റെ വിജയവും സഹായവും പ്രകാശവും ബറകത്തും സന്മാർഗവും — ഞാൻ നിന്നോട് ചോദിക്കുന്നു. അതിലുള്ള തിന്മയിൽ നിന്നും അതിനു ശേഷമുള്ള തിന്മയിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു.",
    mle:"ഞങ്ങൾ സന്ധ്യയിൽ പ്രവേശിച്ചിരിക്കുന്നു; ആധിപത്യം ലോകരക്ഷിതാവായ അല്ലാഹുവിന്റേതായിരിക്കെ. അല്ലാഹുവേ, ഈ രാത്രിയുടെ നന്മ — അതിന്റെ വിജയവും സഹായവും പ്രകാശവും ബറകത്തും സന്മാർഗവും — ഞാൻ നിന്നോട് ചോദിക്കുന്നു. അതിലുള്ള തിന്മയിൽ നിന്നും അതിനു ശേഷമുള്ള തിന്മയിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു." },
  { ml:"അല്ലാഹുവേ, അദൃശ്യവും ദൃശ്യവും അറിയുന്നവനേ, ആകാശങ്ങളുടെയും ഭൂമിയുടെയും സ്രഷ്ടാവേ, എല്ലാ വസ്തുക്കളുടെയും രക്ഷിതാവും ഉടമസ്ഥനുമായവനേ, നീയല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ലെന്ന് ഞാൻ സാക്ഷ്യം വഹിക്കുന്നു. എന്റെ മനസ്സിന്റെ തിന്മയിൽ നിന്നും, പിശാചിന്റെയും അവന്റെ ശിർക്കിന്റെയും തിന്മയിൽ നിന്നും, എനിക്കു തന്നെ ദോഷം വരുത്തുന്നതിൽ നിന്നും അത് ഒരു മുസ്‌ലിമിലേക്ക് എത്തിക്കുന്നതിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു." },
  { ml:"അല്ലാഹുവിന്റെ പരിപൂർണ്ണമായ വചനങ്ങൾ കൊണ്ട്, അവൻ സൃഷ്ടിച്ചവയുടെ തിന്മയിൽ നിന്ന് ഞാൻ ശരണം തേടുന്നു." },
  { ml:"അല്ലാഹുവേ, ഞങ്ങളുടെ നബി മുഹമ്മദ് (സ്വ) യുടെ മേൽ നീ അനുഗ്രഹവും രക്ഷയും ബറകത്തും ചൊരിയേണമേ." },
  { ml:"അല്ലാഹുവേ, അറിഞ്ഞുകൊണ്ട് നിന്നോട് എന്തിനെയെങ്കിലും പങ്കുചേർക്കുന്നതിൽ നിന്ന് ഞങ്ങൾ നിന്നോട് ശരണം തേടുന്നു. അറിയാതെ ചെയ്തുപോയതിന് ഞങ്ങൾ നിന്നോട് പാപമോചനം തേടുകയും ചെയ്യുന്നു." },
  { ml:"അല്ലാഹുവേ, ആകുലതയിൽ നിന്നും ദുഃഖത്തിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. കഴിവില്ലായ്മയിൽ നിന്നും അലസതയിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. ഭീരുത്വത്തിൽ നിന്നും പിശുക്കിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. കടബാധ്യതയുടെ ഭാരത്തിൽ നിന്നും ആളുകളുടെ അടിച്ചമർത്തലിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു." },
  { ml:"എന്നെന്നും ജീവിച്ചിരിക്കുന്നവനും എല്ലാം നിയന്ത്രിക്കുന്നവനും, താനല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ലാത്തവനുമായ മഹാനായ അല്ലാഹുവിനോട് ഞാൻ പാപമോചനം തേടുന്നു; അവനിലേക്ക് ഞാൻ പശ്ചാത്തപിച്ചു മടങ്ങുന്നു." },
  { ml:"എന്റെ നാഥാ, നിന്റെ മുഖത്തിന്റെ മഹത്വത്തിനും നിന്റെ അധികാരത്തിന്റെ ഗാംഭീര്യത്തിനും യോജിച്ച വിധം നിനക്കാണ് എല്ലാ സ്തുതിയും." },
  { ml:"അല്ലാഹുവല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല; അവൻ ഏകനാണ്, അവന് പങ്കുകാരില്ല. ആധിപത്യം അവന്റേതാണ്, സ്തുതിയും അവനാണ്. അവൻ എല്ലാ കാര്യത്തിനും കഴിവുള്ളവനാണ്." },
  { ml:"അല്ലാഹുവേ, നീയാണ് എന്റെ രക്ഷിതാവ്. നീയല്ലാതെ ആരാധനക്കർഹനായി ആരുമില്ല. നിന്നിൽ ഞാൻ ഭരമേൽപ്പിച്ചിരിക്കുന്നു. നീ മഹത്തായ അർശിന്റെ രക്ഷിതാവാണ്. അല്ലാഹു ഉദ്ദേശിച്ചത് സംഭവിക്കും; അവൻ ഉദ്ദേശിക്കാത്തത് സംഭവിക്കുകയില്ല. അത്യുന്നതനും മഹാനുമായ അല്ലാഹുവിനെക്കൊണ്ടല്ലാതെ യാതൊരു ശക്തിയും കഴിവുമില്ല. അല്ലാഹു എല്ലാ കാര്യത്തിനും കഴിവുള്ളവനാണെന്നും, അല്ലാഹു എല്ലാ കാര്യത്തെയും അറിവുകൊണ്ട് വലയം ചെയ്തിരിക്കുന്നുവെന്നും ഞാൻ അറിയുന്നു. അല്ലാഹുവേ, എന്റെ മനസ്സിന്റെ തിന്മയിൽ നിന്നും, നീ നെറുകയിൽ പിടിച്ചിരിക്കുന്ന എല്ലാ ജീവികളുടെയും തിന്മയിൽ നിന്നും ഞാൻ നിന്നോട് ശരണം തേടുന്നു. തീർച്ചയായും എന്റെ നാഥൻ നേരായ പാതയിലാകുന്നു." },
  { ml:"അല്ലാഹുവിനെ സ്തുതിച്ചുകൊണ്ട് ഞാൻ അവനെ പരിശുദ്ധപ്പെടുത്തുന്നു." },
];
if (ML.length !== LIST.length) console.error('ML length mismatch', ML.length, LIST.length);
LIST.forEach((z, i) => Object.assign(z, ML[i] || {}));

const times = n => n === 1 ? "مرة واحدة" : n === 2 ? "مرتان" : n <= 10 ? n + " مرات" : n + " مرة";
const fmtNote = z => (z.label ? z.label + " — " : "") + times(z.target);
const DATA = {
  morning: LIST.filter(z => z.m).map(z => ({ text: z.m, ml: z.ml, note: fmtNote(z), target: z.target })),
  evening: LIST.map(z => ({ text: z.e === undefined ? z.m : z.e, ml: z.mle || z.ml, note: fmtNote(z), target: z.target }))
               .filter(z => z.text),
};

// in-memory state only (no browser storage)
const state = {
  morning: DATA.morning.map(z => z.target),
  evening: DATA.evening.map(z => z.target),
};

function buildList(key){
  const container = document.getElementById(key + '-list');
  container.innerHTML = '';
  DATA[key].forEach((zikr, i) => {
    const card = document.createElement('div');
    card.className = 'zikr-card';
    card.id = `${key}-card-${i}`;
    card.innerHTML = `
      <div class="zikr-text">${zikr.text}</div>
      ${zikr.ml ? `
      <button class="ml-toggle" id="${key}-mlbtn-${i}" aria-expanded="false" aria-controls="${key}-ml-${i}" onclick="toggleMl('${key}', ${i})">
        <span>മലയാളം അർത്ഥം</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="ml-text" id="${key}-ml-${i}" lang="ml">${zikr.ml}</div>` : ''}
      <div class="zikr-meta">
        <span class="zikr-note">${zikr.note}</span>
        <button class="counter-btn ${key === 'morning' ? 'morning-c' : 'evening-c'}" id="${key}-btn-${i}" onclick="tap('${key}', ${i})"></button>
      </div>`;
    container.appendChild(card);
  });
  refresh(key);
}

function toggleMl(key, i){
  const card = document.getElementById(`${key}-card-${i}`);
  const open = card.classList.toggle('ml-open');
  document.getElementById(`${key}-mlbtn-${i}`).setAttribute('aria-expanded', open);
}

function tap(key, i){
  if(state[key][i] > 0){
    state[key][i]--;
    refresh(key, i);
  }
}

function refresh(key, i){
  const indices = (i === undefined) ? DATA[key].map((_,idx)=>idx) : [i];
  indices.forEach(idx => {
    const remaining = state[key][idx];
    const btn = document.getElementById(`${key}-btn-${idx}`);
    const card = document.getElementById(`${key}-card-${idx}`);
    if(remaining === 0){
      btn.textContent = '✓';
      btn.classList.add('finished');
      card.classList.add('done');
    } else {
      btn.textContent = remaining;
      btn.classList.remove('finished');
      card.classList.remove('done');
    }
  });
  const total = DATA[key].length;
  const done = state[key].filter(v => v === 0).length;
  document.getElementById(`${key}-progress-label`).textContent = `${done} / ${total} مكتمل`;
  document.getElementById(`${key}-progress-fill`).style.width = `${(done/total)*100}%`;
}

function resetList(key){
  state[key] = DATA[key].map(z => z.target);
  refresh(key);
}

function openList(key){
  document.getElementById('home').classList.remove('active');
  document.getElementById(key).classList.add('active');
}
function goHome(){
  document.getElementById('morning').classList.remove('active');
  document.getElementById('evening').classList.remove('active');
  document.getElementById('home').classList.add('active');
}

function setThemeLabel(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('theme-btn').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('azkar-theme', next); } catch(e){}
  setThemeLabel();
}
setThemeLabel();

buildList('morning');
buildList('evening');
</script>
</body>
</html>
